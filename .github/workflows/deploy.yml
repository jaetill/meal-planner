name: Deploy to S3 + CloudFront

on:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    environment: production   # ADR-0043: prod deploys wait for maintainer approval
    runs-on: ubuntu-latest
    env:
      # Sentry release env. SENTRY_AUTH_TOKEN gates the source-map / release
      # creation step below: if the secret is absent the step is a no-op so the
      # deploy still works during initial onboarding.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for set-commits=auto
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Install lambda dependencies
        # Each Lambda zip bundles handler + lib/ + node_modules so @sentry/aws-serverless
        # is available at runtime. No node_modules in the zip = no Sentry wrap.
        run: npm ci --legacy-peer-deps --prefix lambda
      - run: npm run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_DEPLOY_ENV: production
          VITE_RELEASE_VERSION: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - name: Ensure Lambda runtimes are nodejs22.x
        run: |
          for fn in MealPlannerSave meal-planner-alexa meal-planner-groups meal-planner-nutrition meal-planner-kroger meal-planner-share meal-planner-plan meal-planner-feedback; do
            current=$(aws lambda get-function-configuration --function-name "$fn" --region us-east-2 --query 'Runtime' --output text)
            if [ "$current" != "nodejs22.x" ]; then
              echo "Updating $fn from $current to nodejs22.x"
              aws lambda update-function-configuration \
                --function-name "$fn" \
                --runtime nodejs22.x \
                --region us-east-2 >/dev/null
              aws lambda wait function-updated --function-name "$fn" --region us-east-2
            else
              echo "$fn already on nodejs22.x"
            fi
          done
      - name: Sync HTML to S3 (no-cache)
        run: |
          aws s3 sync dist/ s3://jaetill-meal-planner/ \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"
      - name: Sync assets to S3 (immutable)
        run: |
          aws s3 sync dist/assets/ s3://jaetill-meal-planner/assets/ \
            --cache-control "max-age=31536000, immutable"
      - name: Invalidate CloudFront HTML
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E301SUJKLJO7A7 \
            --paths "/index.html" "/login.html"

      # Lambda deploys: each zip includes handler + lib/ + node_modules so the
      # `require('./lib/sentry')` in each handler can resolve @sentry/aws-serverless.
      # Using `pushd lambda` + `zip -r` keeps relative paths intact inside the zip.
      - name: Deploy save Lambda
        run: |
          pushd lambda
          zip -r ../save.zip save.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name MealPlannerSave \
            --zip-file fileb://save.zip \
            --region us-east-2
      - name: Deploy alexa Lambda
        run: |
          pushd lambda
          zip -r ../alexa.zip alexa.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-alexa \
            --zip-file fileb://alexa.zip \
            --region us-east-2
      - name: Deploy groups Lambda
        run: |
          pushd lambda
          zip -r ../groups.zip groups.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-groups \
            --zip-file fileb://groups.zip \
            --region us-east-2
      - name: Deploy nutrition Lambda
        run: |
          pushd lambda
          zip -r ../nutrition.zip nutrition.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-nutrition \
            --zip-file fileb://nutrition.zip \
            --region us-east-2
      - name: Deploy kroger Lambda
        run: |
          pushd lambda
          zip -r ../kroger.zip kroger.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-kroger \
            --zip-file fileb://kroger.zip \
            --region us-east-2
      - name: Deploy share Lambda
        run: |
          pushd lambda
          zip -r ../share.zip share.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-share \
            --zip-file fileb://share.zip \
            --region us-east-2
      - name: Deploy feedback Lambda
        run: |
          pushd lambda
          zip -r ../feedback.zip feedback.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-feedback \
            --zip-file fileb://feedback.zip \
            --region us-east-2
      - name: Deploy plan Lambda
        run: |
          pushd lambda
          zip -r ../plan.zip plan.js lib node_modules
          popd
          aws lambda update-function-code \
            --function-name meal-planner-plan \
            --zip-file fileb://plan.zip \
            --region us-east-2

      # Sentry release: tag this commit as a release and associate commits since
      # the previous release. Frontend events match by VITE_RELEASE_VERSION =
      # github.sha set at build time above. Lambda events match by their
      # RELEASE_VERSION env var (set out-of-band via aws lambda update-function-configuration).
      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        with:
          version: ${{ github.sha }}
          environment: production
          set_commits: auto
          finalize: true