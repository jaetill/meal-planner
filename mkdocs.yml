site_name: meal-planner
site_url: https://jaetill.github.io/meal-planner/
repo_url: https://github.com/jaetill/meal-planner
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.tabs
    - navigation.sections
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: { alternate_style: true }
  - tables
  - toc: { permalink: true, toc_depth: 3 }

nav:
  - Home: index.md
  - Standards:
      - Overview: standards/index.md
      - Source control: standards/01-source-control.md
      - CI/CD: standards/02-ci-cd.md
      - Testing: standards/03-testing.md
      - Quality gates: standards/04-quality-gates.md
      - Documentation: standards/05-documentation.md
      - Observability: standards/06-observability.md
      - Secrets: standards/07-secrets.md
      - IaC: standards/08-iac.md
      - Release management: standards/09-release-management.md
      - AI workflows: standards/10-ai-workflows.md
      - User feedback: standards/11-user-feedback.md
  - ADRs:
      - 'ADR-0001 — Platform adoption (meal-planner)': adr/0001-platform-adoption.md
      - 'ADR-0001 — Platform foundations': adr/0001-platform-foundations.md
      - 'ADR-0002 — Source control': adr/0002-source-control.md
      - 'ADR-0003 — CI/CD': adr/0003-ci-cd.md
      - 'ADR-0004 — Testing': adr/0004-testing.md
      - 'ADR-0005 — Quality gates': adr/0005-quality-gates.md
      - 'ADR-0006 — Secrets': adr/0006-secrets.md
      - 'ADR-0007 — IaC': adr/0007-iac.md
      - 'ADR-0008 — Documentation': adr/0008-documentation.md
      - 'ADR-0009 — Observability': adr/0009-observability.md
      - 'ADR-0010 — Release management': adr/0010-release-management.md
      - 'ADR-0011 — AI workflows': adr/0011-ai-workflows.md
      - 'ADR-0012 — User feedback': adr/0012-user-feedback.md
      - 'ADR-0013 — Grafana CloudWatch pull': adr/0013-grafana-cloudwatch-pull.md
      - 'ADR-0014 — Lambda Sentry observability': adr/0014-lambda-sentry-observability.md
      - 'ADR template': adr/template.md
  - Runbooks:
      - Overview: runbooks/index.md
      - Deploy: runbooks/deploy.md
      - Rollback: runbooks/rollback.md
      - Incident response: runbooks/incident-response.md
      - Sentry alerts: runbooks/sentry-alerts.md
      - Secret leak: runbooks/secret-leak.md
      - IaC recovery: runbooks/iac-recover.md
  - Audits:
      - 'IAM Audit (2026-04-12)': iam-audit.md

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/jaetill/meal-planner